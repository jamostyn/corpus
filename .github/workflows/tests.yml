name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Corpus is developed on macOS; the suite is run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - run: node --test tests/src/*.test.js
